<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        .first_div{
            background: url('https://images.template.net/122656/ramadan-image-background-z9hci.jpg');
            width: 100%;
            height: 787px;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
        .first_div h1{
            text-align: center;
            font-weight: 900px;
            font-size: 60px;
            padding-top: 600px;
        }
        .second_div{
            background: url('https://img.freepik.com/free-vector/ramadan-card-vector_43623-1049.jpg');
            width: 100%;
            height: 787px;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
        .second_div h1{
            color: yellow;
            text-align: start;
            font-weight: 900px;
            font-size: 60px;
            margin-left: 200px;
            padding-top: 200px;
        }
        .second_div p{
            color: yellow;
            font-weight: 900px;
            font-size: 20px;
            width: 700px;
            line-height: 34px;
            margin-left: 220px;
        }
    </style>
</head>
<body>
    <div class="first_div">
        <h1>Happy Ramadhan!</h1>
    </div>
    <div class="second_div">
        <h1>Peace Be Upon You</h1>
        <p>Let's make fasting in the whole Ramadhan, reciting the Holy Quran and Pray Namarz Regularly.</p>
    </div>
</body>
</html>
